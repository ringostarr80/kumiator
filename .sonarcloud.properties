# Automatic Analysis: ohne sonar.tests gilt tests/ als Produktivcode, und MAIN-Regeln
# (S1192 Literal-Duplikate, S112 generische Exceptions) feuern auf Test-Fixtures.
sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**

# Die Duplikaterkennung setzt jedes String-Literal gleich; zwei Übersetzungseinträge
# gelten damit als Kopie, und jede neue Übersetzung zählt als dupliziert.
sonar.cpd.exclusions=lang/**
