# Disposable servers for `composer test:mariadb` and `composer test:pgsql`, in CI and locally.
# They hold nothing worth a password, so the ports stay on the loopback interface. The host ports differ
# from the defaults, otherwise a test run could reach a database server installed on the developer machine.
# The data directories the images declare as volumes are tmpfs mounts instead, so no anonymous volume is
# created that podman-compose would leave behind on `down --volumes`.
services:
  mariadb:
    # The lts tag follows the current LTS line. Dependabot only moves the digest here, a version number
    # would make it offer the short-term releases in between
    image: mariadb:lts@sha256:d46e102fa8b9b72bfcdeb56f9dd538742092119dc8b11f31fe662605cd234cd9
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: kumiator_test
    tmpfs:
      - /var/lib/mysql
    ports:
      - "127.0.0.1:33306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

  pgsql:
    image: postgres:18.6@sha256:bd5dfa494a5a259704365813dbfa5fa6b3e69be7348d43b547f540c730478583
    environment:
      POSTGRES_DB: kumiator_test
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: root
    tmpfs:
      - /var/lib/postgresql
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      # Over TCP, because the temporary server of the image's first start only listens on the socket
      test: ["CMD", "pg_isready", "--host=127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 30
