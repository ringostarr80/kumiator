; Error reporting
error_reporting = E_ALL
display_errors = Off
log_errors = On

; Memory and limits
memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 64M
post_max_size = 64M

; Opcache (disable revalidation for development to avoid stale cache issues)
opcache.enable = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
