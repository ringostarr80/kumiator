; Local development only — display_errors=On would leak stack traces and
; paths to clients in production (see docs/deployment.md).

; Error reporting
error_reporting = E_ALL
display_errors = On
log_errors = On

; Memory and limits
memory_limit = 256M
max_execution_time = 30
upload_max_filesize = 16M
post_max_size = 16M

; Session — die App fährt Laravels eigenen Session-Handler (config/session.php),
; die PHP-native Session bleibt ungenutzt. Die Flags stehen hier, damit sie nicht
; auf ihren unsicheren Defaults liegen, falls doch je etwas darauf zugreift.
session.cookie_httponly = 1
session.cookie_secure = 1

; Opcache (disable revalidation for development to avoid stale cache issues)
opcache.enable = 1
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1
