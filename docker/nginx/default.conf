# Local development only — self-signed certificate, no HSTS/security
# headers; a public-facing vhost needs full header hardening
# (see docs/deployment.md).
server {
    listen 80;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    root /var/www/html/public;
    index index.php;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    charset utf-8;

    client_max_body_size 16M;

    # As absolute URLs, the redirects nginx issues itself (a directory or /mailpit without the
    # trailing slash) would carry the container port 443 instead of the published 8443
    absolute_redirect off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Mailpit from docker-compose.yml, whose MP_WEBROOT has to match this path; ^~ keeps the regex
    # locations below away from everything under it
    location ^~ /mailpit/ {
        proxy_pass http://mailpit:8025;
        # Mailpit rejects requests whose Origin header does not match the Host header
        proxy_set_header Host $http_host;
        # The web interface keeps a WebSocket open
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
