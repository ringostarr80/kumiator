# Codecov's built-in defaults differ by account creation date, so the checks this repository relies on are pinned here
# Both targets mirror the --min=90 gate the test suite already enforces
# Codecov merges every report uploaded for a commit, so each status names the flag it
# judges — otherwise a second suite would silently move a target meant for the PHP one
coverage:
  status:
    project:
      default:
        target: 90%
        # Deleting well-covered code lowers the total without anyone writing worse code
        threshold: 1%
        flags:
          - php
    patch:
      default:
        target: 90%
        flags:
          - php
