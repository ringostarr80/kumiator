# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      # The Actions ecosystem does not support the semver-* variants (zizmor requires >= 7)
      default-days: 7

  # A separate entry is required because the ecosystem only scans .github/workflows
  # plus a root-level action manifest, never .github/actions subdirectories
  - package-ecosystem: github-actions
    directory: /.github/actions/setup-php-env
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: "composer" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Wait before adopting freshly published releases to reduce the risk of
    # pulling in a compromised or yanked package version.
    cooldown:
      default-days: 7        # baseline for anything without a specific rule (zizmor requires >= 7)
      semver-patch-days: 3    # patches often carry security fixes — adopt them quickly
      semver-minor-days: 7    # minor releases get a moderate soak period
      semver-major-days: 14   # breaking changes / largest attack surface — longest soak
