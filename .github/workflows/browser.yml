name: Browser

permissions: {}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A pull request only needs a verdict for its latest push, every main commit keeps its own
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read  # Required by actions/checkout to read the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-php-env
        with:
          php-version: '8.4'

      - uses: $/.github/actions/setup-node-env

      # The tests only run headless, which needs the shell build and not the full browser
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run browser tests
        run: npm run test:e2e

      # The report carries a trace per failed test, which shows what covered the element a click missed
      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
