name: PHP

permissions: {}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A pull request only needs a verdict for its latest push, every main commit keeps its own
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  composer-integrity:
    name: Composer manifest & advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read  # Required by actions/checkout to read the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      # Catches the lock hash drifting away from composer.json after a manual edit
      - name: Validate composer.json against composer.lock
        run: composer validate --strict

      # --locked audits the pinned versions, so no vendor install is needed
      # An upstream abandon marker is no vulnerability, so it must not block unrelated pull requests
      - name: Audit dependencies for known advisories
        run: composer audit --locked --abandoned=report

  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read  # Required by actions/checkout to read the repository
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-php-env
        with:
          php-version: ${{ matrix.php }}

      # Syntax check runs against the matrix engine, so it covers both target versions
      - name: Check syntax
        run: composer dev:lint:php

      - name: Check coding standard
        run: composer dev:lint:phpcs

  phpstan:
    name: PHPStan (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read  # Required by actions/checkout to read the repository
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-php-env
        with:
          php-version: ${{ matrix.php }}

      # Each matrix entry picks the config carrying the matching phpVersion setting
      - name: Analyse
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: composer "dev:analyze:phpstan-${PHP_VERSION}"

  architecture:
    name: Architecture rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read  # Required by actions/checkout to read the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-php-env
        with:
          php-version: '8.4'

      # phpat.neon pins no phpVersion, so the rules only need a single run
      - name: Check architecture boundaries
        run: composer dev:analyze:phpat

  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read  # Required by actions/checkout to read the repository
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        # Flagging the uploader next to the version list keeps a bump from leaving the selector behind
        include:
          - php: '8.4'
            primary: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-php-env
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          ini-values: memory_limit=512M

      - name: Generate application key
        run: php artisan key:generate

      - uses: ./.github/actions/setup-node-env

      # Feature tests render layouts using @vite, which needs a built manifest
      - name: Build assets
        run: npm run build

      # Sharing the script with local runs keeps --min=90 and the report paths in a single place
      - name: Run tests
        id: tests
        run: composer test

      # Only one matrix entry uploads, so Codecov reports a verdict without waiting for further builds
      # !cancelled() keeps the report flowing when --min=90 fails, which is when the missing lines matter most
      # A skipped test step means a setup step failed, so there is no report file to upload
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' && matrix.primary }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          # codecov.yml scopes the coverage targets to this flag
          flags: php
          # A silently failed upload would freeze the badge on a stale value, and no status check would report it
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' && matrix.primary }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml
          disable_search: true
          report_type: test_results
          flags: php
          fail_ci_if_error: true
