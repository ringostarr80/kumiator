name: PHP

permissions: {}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A pull request only needs a verdict for its latest push, every main commit keeps its own
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  composer-integrity:
    name: Composer manifest & advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read  # Required by actions/checkout to read the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      # Catches the lock hash drifting away from composer.json after a manual edit
      - name: Validate composer.json against composer.lock
        run: composer validate --strict

      # --locked audits the pinned versions, so no vendor install is needed
      # An upstream abandon marker is no vulnerability, so it must not block unrelated pull requests
      - name: Audit dependencies for known advisories
        run: composer audit --locked --abandoned=report

  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read  # Required by actions/checkout to read the repository
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-php-env
        with:
          php-version: ${{ matrix.php }}

      # Syntax check runs against the matrix engine, so it covers both target versions
      - name: Check syntax
        run: composer dev:lint:php

      - name: Check coding standard
        run: composer dev:lint:phpcs

  phpstan:
    name: PHPStan (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read  # Required by actions/checkout to read the repository
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-php-env
        with:
          php-version: ${{ matrix.php }}

      # Each matrix entry picks the config carrying the matching phpVersion setting
      - name: Analyse
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: composer "dev:analyze:phpstan-${PHP_VERSION}"

  architecture:
    name: Architecture rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read  # Required by actions/checkout to read the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-php-env
        with:
          php-version: '8.4'

      # phpat.neon pins no phpVersion, so the rules only need a single run
      - name: Check architecture boundaries
        run: composer dev:analyze:phpat

  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read  # Required by actions/checkout to read the repository
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-php-env
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov
          ini-values: memory_limit=512M

      - name: Generate application key
        run: php artisan key:generate

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Feature tests render layouts using @vite, which needs a built manifest
      - name: Build assets
        run: npm run build

      - name: Run tests
        run: |
          php artisan config:clear --ansi
          php artisan test --coverage --parallel --min=90
