name: PHP

permissions: {}

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # ext-pdo_sqlite/ext-sqlite3 back the in-memory test database configured in phpunit.xml
  # ext-pdo_mysql lets config/database.php evaluate its SSL-CA branch instead of skipping it
  PHP_EXTENSIONS: dom, fileinfo, iconv, mbstring, openssl, pdo_mysql, pdo_sqlite, simplexml, sqlite3, xml, zip

jobs:
  composer-integrity:
    name: Composer manifest & advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required by actions/checkout to read the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none

      # Catches the lock hash drifting away from composer.json after a manual edit
      - name: Validate composer.json against composer.lock
        run: composer validate --strict

      # --locked audits the pinned versions, so no vendor install is needed
      - name: Audit dependencies for known advisories
        run: composer audit --locked

  lint:
    name: Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required by actions/checkout to read the repository
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      # composer install runs artisan package:discover, which boots the application
      - name: Prepare environment file
        run: cp .env.example .env

      - name: Restore Composer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Syntax check runs against the matrix engine, so it covers both target versions
      - name: Check syntax
        run: composer dev:lint:php

      - name: Check coding standard
        run: composer dev:lint:phpcs

  phpstan:
    name: PHPStan (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required by actions/checkout to read the repository
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Restore Composer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Each matrix entry picks the config carrying the matching phpVersion setting
      - name: Analyse
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: composer "dev:analyze:phpstan-${PHP_VERSION}"

  architecture:
    name: Architecture rules
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required by actions/checkout to read the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Restore Composer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # phpat.neon pins no phpVersion, so the rules only need a single run
      - name: Check architecture boundaries
        run: composer dev:analyze:phpat

  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required by actions/checkout to read the repository
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          ini-values: memory_limit=512M
          coverage: pcov

      - name: Prepare environment file
        run: cp .env.example .env

      - name: Restore Composer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      # Feature tests render layouts using @vite, which needs a built manifest
      - name: Build assets
        run: npm run build

      - name: Run tests
        run: |
          php artisan config:clear --ansi
          php artisan test --coverage --parallel --min=90
