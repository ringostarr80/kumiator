name: Mutation

permissions: {}

on:
  pull_request:
    branches: [ "main" ]
  # A full run takes hours, so it only runs once a month and on demand
  schedule:
    - cron: '23 2 1 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A pull request only needs a verdict for its latest push, a full run is too expensive to throw away
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changed-lines:
    name: Mutation tests (changed lines)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read  # Required by actions/checkout to read the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Infection diffs against the merge base with origin/main, which a shallow clone lacks
          fetch-depth: 0

      - uses: $/.github/actions/setup-php-env
        with:
          php-version: '8.4'
          coverage: pcov
          ini-values: memory_limit=512M

      - name: Generate application key
        run: php artisan key:generate

      - uses: $/.github/actions/setup-node-env

      # Feature tests render layouts using @vite, which needs a built manifest
      - name: Build assets
        run: npm run build

      # Infection detects GitHub Actions and reports escaped mutants as annotations on the diff
      - name: Mutate changed lines
        run: composer test:mutation:diff

      # GitHub shows at most ten annotations per step, and uncovered mutants get none at all
      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infection-report
          path: build/infection/infection.html
          # The report is only needed until the pull request is merged
          retention-days: 14
          # Infection writes no report when the pull request changes nothing under app/
          if-no-files-found: ignore

  full:
    name: Mutation tests (full)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    # GitHub-hosted runners stop every job after six hours
    timeout-minutes: 360
    permissions:
      contents: read  # Required by actions/checkout to read the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-php-env
        with:
          php-version: '8.4'
          coverage: pcov
          ini-values: memory_limit=512M

      - name: Generate application key
        run: php artisan key:generate

      - uses: $/.github/actions/setup-node-env

      # Feature tests render layouts using @vite, which needs a built manifest
      - name: Build assets
        run: npm run build

      # Infection would log every escaped mutant as a warning, while the uploaded report already lists them all
      - name: Run mutation tests
        run: composer test:mutation -- --logger-github=false

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infection-report
          path: build/infection/infection.html
          # Keeps the report until the next monthly run replaces it
          retention-days: 31
