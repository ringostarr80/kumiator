name: Set up Node with dependencies
description: Installs the Node version pinned in .nvmrc and an npm install backed by the shared cache

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        # .nvmrc keeps every workflow and local shell on the same engine
        node-version-file: .nvmrc
        cache: npm

    - name: Install frontend dependencies
      shell: bash
      # --ignore-scripts: kein Paket im Baum braucht Lifecycle-Skripte, also
      # gibt es keinen Grund, sie einem kompromittierten Paket anzubieten
      run: npm ci --ignore-scripts
