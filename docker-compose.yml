# Local development only — never use this setup as a production template:
# the PHP, entrypoint and nginx configs deliberately trade security for dev
# convenience. Production deploys via `composer deploy` (see docs/deployment.md).
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    # Wins over env_file, so mail reaches Mailpit whatever the .env says; its defaults serve the
    # setup without Docker
    environment:
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    healthcheck:
      # php-fpm only starts once entrypoint.sh has installed the dependencies and run the migrations
      test: ["CMD", "pgrep", "php-fpm"]
      interval: 5s
      start_period: 10m
    networks:
      - app-network

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    # Bypasses entrypoint.sh, which the app container already runs: started side by side on the first
    # run, both would install the dependencies and migrate the database in the shared project folder.
    # queue:listen boots a fresh worker for every poll, so code changes apply without a container
    # restart; the longer --sleep spaces out those boots, --rest keeps a worker that fails on boot
    # from respawning in a tight loop
    entrypoint: ["php", "artisan", "queue:listen", "--tries=1", "--timeout=0", "--sleep=10", "--rest=1"]
    # PHP as PID 1 does not end on the stop signal, so every stop would wait out the grace period
    init: true
    # queue:listen exits when its own boot fails or a worker dies from a signal
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    environment:
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    depends_on:
      app:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - app-network

  nginx:
    build:
      context: ./docker/nginx
    # Loopback only: nginx also serves the Mailpit web interface, which has no login
    ports:
      - "127.0.0.1:8000:80"
      - "127.0.0.1:8443:443"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-ssl:/etc/nginx/ssl
    # nginx resolves its upstream hosts at startup and refuses to start without them
    depends_on:
      - app
      - mailpit
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    # No published ports: nginx serves the web interface, and only the containers on the app network
    # send mail
    environment:
      # Has to match the location in docker/nginx/default.conf, which passes the path on unchanged
      MP_WEBROOT: /mailpit/
    networks:
      - app-network

volumes:
  nginx-ssl:

networks:
  app-network:
    driver: bridge
