services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    networks:
      - app-network

  nginx:
    build:
      context: ./docker/nginx
    ports:
      - "8000:80"
      - "8443:443"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-ssl:/etc/nginx/ssl
    depends_on:
      - app
    networks:
      - app-network

volumes:
  nginx-ssl:

networks:
  app-network:
    driver: bridge
